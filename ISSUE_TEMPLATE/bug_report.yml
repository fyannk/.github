name: Bug report
description: Something does not work as documented.
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. For a security issue, do not use this form: follow SECURITY.md instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you observed, including exact error messages.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Deploy with ...
        2. Run ...
        3. See ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.4.2 or abc1234
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Kubernetes/OpenShift version, PostgreSQL and operator versions, OS, browser, as relevant.
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove any secrets, tokens, or customer data before pasting.
      render: shell
